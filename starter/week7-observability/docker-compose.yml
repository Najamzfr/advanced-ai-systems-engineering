services:
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/ase-dashboard.json:ro
      - ./dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - lgtm-data:/data
volumes:
  lgtm-data:
